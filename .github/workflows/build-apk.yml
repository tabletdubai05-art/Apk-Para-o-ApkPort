name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Limpar pacotes conflitantes e gerar build web
        run: |
          rm -rf node_modules package-lock.json
          sed -i '/@capacitor\/filesystem/d' package.json
          npm install --legacy-peer-deps
          npm run build

      - name: Instalar e configurar Capacitor Android e Browser
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/browser@6 --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.js
          echo '{"appId":"com.droidport.store","appName":"DroidPort Store","webDir":"dist"}' > capacitor.config.json
          npx cap add android

      - name: Substituir icone do Android pelo icon.png
        run: |
          mkdir -p assets
          if [ -f "public/icon.png" ]; then cp public/icon.png assets/icon.png; fi
          if [ -f "icon.png" ]; then cp icon.png assets/icon.png; fi
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android
          fi
          npx cap sync

      - name: Atualizar versionCode e Compilar APK
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../DroidPort-Store.apk

      - name: Disponibilizar DroidPort-Store.apk nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DroidPort-Store-APK
          path: DroidPort-Store.apk

      - name: Publicar Release Automatica no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Atualizacao Build ${{ github.run_number }}
          files: DroidPort-Store.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
