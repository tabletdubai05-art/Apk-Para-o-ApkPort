name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sincronizar versao automatica, instalar dependencias e gerar build web
        run: |
          sed -i "s/v1\.0\.[0-9]\+/v1.0.${{ github.run_number }}/g" src/*.tsx src/*.ts src/**/*.tsx src/**/*.ts 2>/dev/null || true
          npm install --legacy-peer-deps
          npm run build

      - name: Instalar e configurar Capacitor Android e Plugins
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.js
          echo '{"appId":"com.droidport.store","appName":"DroidPort Store","webDir":"dist","plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npx cap add android

      - name: Substituir icone do Android pelo icon.png
        run: |
          mkdir -p assets
          if [ -f "public/icon.png" ]; then cp public/icon.png assets/icon.png; fi
          if [ -f "icon.png" ]; then cp icon.png assets/icon.png; fi
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android
          fi
          npx cap sync

      - name: Configurar permissoes de rede e armazenamento no Android
        run: |
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?><network-security-config><base-config cleartextTrafficPermitted="true"><trust-anchors><certificates src="system" /><certificates src="user" /></trust-anchors></base-config></network-security-config>' > android/app/src/main/res/xml/network_security_config.xml
          sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config" android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/><uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" \/>/g' android/app/src/main/AndroidManifest.xml

      - name: Compilar e Assinar APK com Chave Fixa
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          keytool -genkey -v -keystore fixed.keystore -storepass android -alias droidport -keypass android -keyalg RSA -keysize 2048 -validity 10000 -startdate "2025/01/01 00:00:00" -dname "CN=DroidPort, OU=Dev, O=DroidPort, L=SP, S=SP, C=BR"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -p -f 4 app/build/outputs/apk/debug/app-debug.apk aligned.apk
          $BUILD_TOOLS/apksigner sign --ks fixed.keystore --ks-pass pass:android --key-pass pass:android --out ../DroidPort-Store.apk aligned.apk

      - name: Disponibilizar DroidPort-Store.apk nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DroidPort-Store-APK
          path: DroidPort-Store.apk

      - name: Publicar Release Automatica no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Atualizacao v1.0.${{ github.run_number }}
          files: DroidPort-Store.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
