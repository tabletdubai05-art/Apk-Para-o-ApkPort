name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Limpar pacotes conflitantes e gerar build web
        run: |
          rm -rf node_modules package-lock.json
          sed -i '/@capacitor\/filesystem/d' package.json
          npm install --legacy-peer-deps
          npm run build

      - name: Instalar e configurar Capacitor Android, App e Browser
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/browser@6 @capacitor/app@6 --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.js
          echo '{"appId":"com.droidport.store","appName":"DroidPort Store","webDir":"dist"}' > capacitor.config.json
          npx cap add android

      - name: Configurar LibreTorrent e Deep Link Login Google no AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "org.proninyaroslav.libretorrent" "$MANIFEST"; then
            sed -i 's/<\/manifest>/<queries><package android:name="org.proninyaroslav.libretorrent" \/><\/queries><\/manifest>/' "$MANIFEST"
          fi
          if ! grep -q "droidport" "$MANIFEST"; then
            sed -i 's/<\/activity>/<intent-filter><action android:name="android.intent.action.VIEW" \/><category android:name="android.intent.category.DEFAULT" \/><category android:name="android.intent.category.BROWSABLE" \/><data android:scheme="droidport" android:host="login-callback" \/><\/intent-filter><\/activity>/' "$MANIFEST"
          fi

      - name: Configurar Deep Link OAuth no AndroidManifest
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            if (!xml.includes("droidport")) {
              const intentFilter = `
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="droidport" android:host="login-callback" />
            </intent-filter>`;
              xml = xml.replace("</activity>", `${intentFilter}\n        </activity>`);
              fs.writeFileSync(manifestPath, xml, "utf8");
            }
          '

      - name: Substituir icone do Android pelo icon.png
        run: |
          mkdir -p assets
          if [ -f "public/icon.png" ]; then cp public/icon.png assets/icon.png; fi
          if [ -f "icon.png" ]; then cp icon.png assets/icon.png; fi
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android
          fi
          npx cap sync

      - name: Atualizar versionCode e Compilar APK
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Assinar APK com Chave Fixa (KEYSTORE_BASE64)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fixed.keystore
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          $APKSIGNER sign \
            --ks fixed.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out DroidPort-Store.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Disponibilizar DroidPort-Store.apk nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DroidPort-Store-APK
          path: DroidPort-Store.apk

      - name: Publicar Release Automatica no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Atualizacao Build ${{ github.run_number }}
          files: DroidPort-Store.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
